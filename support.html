<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex Support</title>
  <link rel="icon" type="image/jpeg" href="vortex_logo_1787259818226 - Kopya - Kopya.jpg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="site.css">
  <style>
    .support-wrap { max-width: 800px; margin: 100px auto; text-align: center; padding: 0 20px; }
    .discord-card { background: rgba(14, 20, 32, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(88, 101, 242, 0.4); border-radius: 30px; padding: 60px 40px; box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 0 40px rgba(88, 101, 242, 0.1); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .discord-card:hover { transform: translateY(-10px); box-shadow: 0 40px 100px rgba(0,0,0,0.9), inset 0 0 60px rgba(88, 101, 242, 0.2); border-color: #5865f2; }
    .dc-icon { font-size: 5rem; color: #5865f2; margin-bottom: 30px; filter: drop-shadow(0 0 30px rgba(88, 101, 242, 0.6)); animation: float 4s ease-in-out infinite; }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div id="particles-js"></div>

  <!-- NAVIGATION -->
  <header id="siteHeader">
    <div class="wrap nav-container">
      <a href="index.html" class="brand">
        <img class="brand-logo-img" src="vortex_logo_1787259818226 - Kopya - Kopya.jpg" alt="Vortex Client Logo">
        <span class="brand-text">VORTEX</span>
      </a>

      <nav class="nav-links">
        <a href="index.html" class="nav-link">Home</a>
        <a href="features.html" class="nav-link">Features</a>
        <a href="download.html" class="nav-link">Download</a>
        <a href="store.html" class="nav-link">Store</a>
        <a href="socials.html" class="nav-link">Socials</a>
        <a href="news.html" class="nav-link">News</a>
        <a href="support.html" class="nav-link active">Support</a>
      </nav>

      <div class="nav-actions">
        <a href="store.html" class="credit-badge-btn glow-btn" id="navCreditBadge">
          <i class="fa-solid fa-coins" style="color:var(--accent-gold);"></i>
          <span id="headerCr">250</span> CR
        </a>
        <button class="menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
      </div>
    </div>
  </header>

  <main class="support-wrap reveal">
    <div class="discord-card">
      <i class="fa-brands fa-discord dc-icon"></i>
      <h1 style="font-size:3rem; font-weight:900; margin-bottom:20px; color:#fff;">Need Help?</h1>
      <p style="font-size:1.2rem; color:var(--text-sub); margin-bottom:40px; line-height:1.6;">
        Our support team is active 24/7 on the official Vortex Discord server.<br>Join now to open a ticket, report a bug, or get help with your account.
      </p>
      <a href="https://discord.gg/7P6V3pASw" target="_blank" class="btn glow-btn" style="background:#5865f2; color:#fff; font-size:1.2rem; padding:18px 40px; box-shadow:0 10px 40px rgba(88, 101, 242, 0.5);">
        Join Vortex Discord
      </a>
    </div>
  </main>

  <footer>
    <div class="wrap">
      <div class="footer-top">
        <div class="brand">
          <img class="brand-logo-img" src="vortex_logo_1787259818226 - Kopya - Kopya.jpg" alt="Vortex Client">
          <span class="brand-text">VORTEX CLIENT</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="vortex-credits.js"></script>
  <script src="site.js"></script>
</body>
</html>
