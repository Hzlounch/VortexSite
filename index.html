<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Launcher - The Ultimate Minecraft Client</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }
        body, html {
            height: 100%;
            background-color: #0d0f12;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Arka Plan Minecraft Efekti (Koyu ve Atmosferik) */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(7, 9, 13, 0.75), rgba(7, 9, 13, 0.85)), 
                        url('https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?q=80&w=1920&auto=format&fit=crop') no-repeat center center/cover;
            z-index: -1;
            filter: brightness(0.6);
        }

        /* Top Navigation Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #12151b;
            padding: 0 40px;
            height: 80px;
            border-bottom: 2px solid #1a1e26;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900;
            font-size: 20px;
            letter-spacing: 1px;
            color: white;
            text-decoration: none;
        }

        .brand-logo img {
            width: 36px;
            height: 36px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: #9ca3af;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .download-top-btn {
            background-color: #dc2626;
            color: white;
            padding: 14px 28px;
            font-weight: 900;
            font-size: 14px;
            text-transform: uppercase;
            text-decoration: none;
            border-radius: 4px;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        .download-top-btn:hover {
            background-color: #b91c1c;
            transform: translateY(-2px);
        }

        /* Hero Section (Ortadaki Büyük Alan) */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: calc(100vh - 80px);
            padding: 0 20px;
        }

        .hero-logo-box {
            width: 110px;
            height: 110px;
            background: #1a1e26;
            border: 3px solid #2d3748;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .hero-logo-box span {
            font-size: 50px;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
        }

        .hero p {
            font-size: 18px;
            color: #9ca3af;
            font-weight: 500;
            margin-bottom: 40px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-main-download {
            background-color: #0284c7;
            color: white;
            padding: 15px 35px;
            font-weight: 800;
            font-size: 15px;
            border-radius: 6px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
        }

        .btn-main-download:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
        }

        .btn-store {
            background-color: #ea580c;
            color: white;
            padding: 15px 35px;
            font-weight: 800;
            font-size: 15px;
            border-radius: 6px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background 0.2s, transform 0.2s;
            box-shadow: 0 4px 20px rgba(234, 88, 12, 0.4);
        }

        .btn-store:hover {
            background-color: #c2410c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <!-- Arka Plan Görseli / Atmosfer -->
    <div class="bg-container"></div>

    <!-- Üst Menü (Lunar Tarzı) -->
    <header>
        <div class="nav-left">
            <a href="#" class="brand-logo">
                <span>🛡️</span> VORTEX
            </a>
            <ul class="nav-links">
                <li><a href="#">News</a></li>
                <li><a href="#">Changelog</a></li>
                <li><a href="#">Features</a></li>
                <li><a href="#">Support</a></li>
                <li><a href="#">Store</a></li>
            </ul>
        </div>
        <div class="nav-right">
            <a href="#" class="download-top-btn">Download</a>
        </div>
    </header>

    <!-- Orta Hero Alanı -->
    <div class="hero">
        <div class="hero-logo-box">
            <span>⚡</span>
        </div>
        <h1>VORTEX CLIENT</h1>
        <p>The ultimate performance modpack & launcher for all modern versions of Minecraft!</p>
        
        <div class="hero-buttons">
            <a href="#" class="btn-main-download">📥 DOWNLOAD</a>
            <a href="#" class="btn-store">🛒 STORE</a>
        </div>
    </div>

</body>
</html>
